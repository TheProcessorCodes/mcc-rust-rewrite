name: Bug report
description: Something crashes, looks wrong or plays wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't attach files from MCC, Skate 3 or Reflex (maps, textures, sounds, dumps).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Map and ride
      placeholder: e.g. Valhalla (riverworld), on the dirt bike
  - type: dropdown
    id: games
    attributes:
      label: Games set up
      multiple: true
      options:
        - Halo MCC
        - Skate 3 (extracted folder)
        - Skate 3 (.iso)
        - MX vs ATV Reflex
  - type: input
    id: version
    attributes:
      label: Version
      description: Release name or commit you built.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        On the map menu open Settings (X or F1), go to the Support page and press COPY on
        Diagnostics, then paste it here. It has the version, your Windows version and which games
        are set up, without your username.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: >-
        Settings > Support > Data folder > OPEN opens %LOCALAPPDATA%\MccRustRewrite. Its logs
        folder has a log for each of the last five runs (mcc-<time>.log, newest last) and, if the
        game crashed, crash-<time>.txt. Drag the file for the run that went wrong into this box,
        or paste the end of it. Times in the names are UTC.
      render: text

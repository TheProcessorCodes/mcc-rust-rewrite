# MCC Rust Rewrite: Halo maps from the player's own Master Chief Collection (Halo CE, 2, 3,
# Reach), with Skate 3 skating and the MX vs ATV Reflex dirt bike. Reads the games read-only;
# no game files live here. See HANDOFF.md and README.md.
[workspace]
resolver = "3"
# The vendored Skate 3 engine is its own small workspace (third_party/skate-engine).
exclude = ["third_party"]
members = [
    "crates/blam_anim",
    "crates/blam_cache",
    "crates/blam_cli",
    "crates/blam_effect",
    "crates/blam_geometry",
    "crates/blam_script",
    "crates/blam_h1",
    "crates/blam_h2",
    "crates/blam_reach",
    "crates/blam_sound",
    "crates/blam_texture",
    "crates/fsb_celt",
    "crates/game_paths",
    "crates/mcc-rust-rewrite",
    "crates/mcc_anim",
    "crates/mcc_ai",
    "crates/mcc_audio",
    "crates/mcc_bike",
    "crates/mcc_core",
    "crates/mcc_effects",
    "crates/mcc_foot",
    "crates/mcc_rider",
    "crates/mcc_script",
    "crates/mcc_setup",
    "crates/mcc_skate",
    "crates/mcc_swim",
    "crates/mcc_textures",
    "crates/mcc_weapons",
    "crates/mcc_world",
    "crates/reflex_assets",
]

[workspace.package]
# The release's number: players see it as `beta-<version>` (`game_paths::VERSION`).
version = "0.0.3"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
memmap2 = "0.9"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
thiserror = "2"
anyhow = "1"
winresource = "0.1"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
blam_anim = { path = "crates/blam_anim" }
blam_cache = { path = "crates/blam_cache" }
blam_effect = { path = "crates/blam_effect" }
blam_geometry = { path = "crates/blam_geometry" }
blam_script = { path = "crates/blam_script" }
blam_texture = { path = "crates/blam_texture" }
blam_sound = { path = "crates/blam_sound" }
blam_h1 = { path = "crates/blam_h1" }
blam_h2 = { path = "crates/blam_h2" }
mcc_anim = { path = "crates/mcc_anim" }
mcc_ai = { path = "crates/mcc_ai" }
blam_reach = { path = "crates/blam_reach" }
fsb_celt = { path = "crates/fsb_celt" }
game_paths = { path = "crates/game_paths" }
mcc_audio = { path = "crates/mcc_audio" }
mcc_bike = { path = "crates/mcc_bike" }
mcc_core = { path = "crates/mcc_core" }
mcc_effects = { path = "crates/mcc_effects" }
mcc_foot = { path = "crates/mcc_foot" }
mcc_rider = { path = "crates/mcc_rider" }
mcc_script = { path = "crates/mcc_script" }
mcc_setup = { path = "crates/mcc_setup" }
mcc_skate = { path = "crates/mcc_skate" }
mcc_swim = { path = "crates/mcc_swim" }
mcc_textures = { path = "crates/mcc_textures" }
mcc_weapons = { path = "crates/mcc_weapons" }
mcc_world = { path = "crates/mcc_world" }
reflex_assets = { path = "crates/reflex_assets" }
# The same bevy as IW4L and the skate crates (skate-host wants 0.20 with
# std, multi_threaded and bevy_log), so the skate glue ports over unchanged.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "multi_threaded",
    "bevy_log",
    "bevy_state",
    "bevy_asset",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "bevy_gilrs",
    "tonemapping_luts",
    "zstd_rust",
    "png",
] }

# Map files are hundreds of megabytes; an unoptimised reader is painful, and
# bevy is unusable unoptimised. Our own crates stay at 1 for fast rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What players download (`scripts/release.ps1`): no debug info and no
# symbols, so the exe is small and names nothing of the PC that built it.
[profile.release]
opt-level = 3
debug = false
strip = true

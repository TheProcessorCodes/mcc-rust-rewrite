# Halo 3 (MCC PC) rewrite in Rust. Reads the user's own MCC install read-only;
# no game files live here. See HANDOFF.md and README.md.
[workspace]
resolver = "3"
members = [
    "crates/blam_anim",
    "crates/blam_cache",
    "crates/blam_cli",
    "crates/blam_geometry",
    "crates/blam_script",
    "crates/blam_h2",
    "crates/blam_sound",
    "crates/blam_texture",
    "crates/halo3",
    "crates/halo3_anim",
    "crates/halo3_audio",
    "crates/halo3_bike",
    "crates/halo3_core",
    "crates/halo3_foot",
    "crates/halo3_rider",
    "crates/halo3_script",
    "crates/halo3_skate",
    "crates/halo3_swim",
    "crates/halo3_textures",
    "crates/halo3_weapons",
    "crates/halo3_world",
    "crates/reflex_assets",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
memmap2 = "0.9"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
thiserror = "2"
anyhow = "1"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
blam_anim = { path = "crates/blam_anim" }
blam_cache = { path = "crates/blam_cache" }
blam_geometry = { path = "crates/blam_geometry" }
blam_script = { path = "crates/blam_script" }
blam_texture = { path = "crates/blam_texture" }
blam_sound = { path = "crates/blam_sound" }
blam_h2 = { path = "crates/blam_h2" }
halo3_anim = { path = "crates/halo3_anim" }
halo3_audio = { path = "crates/halo3_audio" }
halo3_bike = { path = "crates/halo3_bike" }
halo3_core = { path = "crates/halo3_core" }
halo3_foot = { path = "crates/halo3_foot" }
halo3_rider = { path = "crates/halo3_rider" }
halo3_script = { path = "crates/halo3_script" }
halo3_skate = { path = "crates/halo3_skate" }
halo3_swim = { path = "crates/halo3_swim" }
halo3_textures = { path = "crates/halo3_textures" }
halo3_weapons = { path = "crates/halo3_weapons" }
halo3_world = { path = "crates/halo3_world" }
reflex_assets = { path = "crates/reflex_assets" }
# The same bevy as IW4L and the skate crates (skate-host wants 0.20 with
# std, multi_threaded and bevy_log), so the skate glue ports over unchanged.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "multi_threaded",
    "bevy_log",
    "bevy_state",
    "bevy_asset",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "bevy_gilrs",
    "tonemapping_luts",
    "zstd_rust",
    "png",
] }

# Map files are hundreds of megabytes; an unoptimised reader is painful, and
# bevy is unusable unoptimised. Our own crates stay at 1 for fast rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

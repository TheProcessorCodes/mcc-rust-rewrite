[package]
name = "blam_cli"
description = "Command-line tools over blam_cache: list tags, classes and strings of a Halo 3 map"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "blam"
path = "src/main.rs"

[dependencies]
blam_cache = { workspace = true }
blam_geometry = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
blam_texture = { workspace = true }
png = "0.18"

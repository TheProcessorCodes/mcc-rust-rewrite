[package]
name = "halo3"
description = "The Halo 3 runtime: window, renderer, flying camera; later players and skating"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "halo3"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_audio"] }
blam_cache = { workspace = true }
blam_geometry = { workspace = true }
blam_texture = { workspace = true }
blam_sound = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
# The Skate 3 board and rig files IW4L derives from skater.glb (read at run time).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
skate-host = { path = "../../../mw2-skate-3-src/src/mashup/skate/crates/skate-host" }

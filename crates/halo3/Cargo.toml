[package]
name = "halo3"
description = "The Halo 3 runtime: wires the halo3_* crates into an app; screenshots and the pause menu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "halo3"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_audio"] }
blam_cache = { workspace = true }
blam_geometry = { workspace = true }
blam_texture = { workspace = true }
blam_h1 = { workspace = true }
blam_h2 = { workspace = true }
anyhow = { workspace = true }
halo3_audio = { workspace = true }
halo3_bike = { workspace = true }
halo3_core = { workspace = true }
halo3_foot = { workspace = true }
halo3_rider = { workspace = true }
halo3_skate = { workspace = true }
halo3_swim = { workspace = true }
halo3_textures = { workspace = true }
halo3_weapons = { workspace = true }
halo3_world = { workspace = true }

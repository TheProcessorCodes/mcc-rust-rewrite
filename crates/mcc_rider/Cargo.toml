[package]
name = "mcc_rider"
description = "The Spartan on the Skate 3 board: skinned rider model posed from the skate engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true }
blam_cache = { workspace = true }
blam_geometry = { workspace = true }
blam_texture = { workspace = true }
# The armour colour chosen in Settings.
game_paths = { workspace = true }
mcc_core = { workspace = true }
mcc_textures = { workspace = true }
mcc_world = { workspace = true }
# The Skate 3 board and rig files IW4L derives from skater.glb (read at run time).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"

[dev-dependencies]
# tests/halo_rig.rs: the Spartan's own skeleton from the player's MCC
# (`game_paths`, a normal dependency), and the bike's and the Spartan-on-foot's rig taking it (mcc_bike depends on
# this crate; a test-only cycle, which cargo allows).
mcc_bike = { workspace = true }

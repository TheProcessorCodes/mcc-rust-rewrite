[package]
name = "halo3_rider"
description = "The Spartan on the Skate 3 board: skinned rider model posed from the skate engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true }
blam_cache = { workspace = true }
blam_geometry = { workspace = true }
blam_texture = { workspace = true }
halo3_core = { workspace = true }
halo3_textures = { workspace = true }
halo3_world = { workspace = true }
# The Skate 3 board and rig files IW4L derives from skater.glb (read at run time).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"

[package]
name = "halo3_bike"
description = "The dirt bike: MX vs ATV Reflex's own simulation, or Unleashed's pulled towards Reflex, on Halo 3 collision"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true }
blam_geometry = { workspace = true }
halo3_core = { workspace = true }
halo3_rider = { workspace = true }
halo3_world = { workspace = true }
reflex_assets = { workspace = true }
# Reflex's own bike simulation (vendored, third_party/reflex-physics).
reflex_bevy = { path = "../../third_party/reflex-physics/crates/reflex_bevy", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
game_paths = { workspace = true }

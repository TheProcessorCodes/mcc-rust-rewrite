[package]
name = "reflex_bevy"
description = "Bevy 0.20 adapter for reflex_core: the Reflex dirt bike as components, no physics engine needed."
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["controls"]
# Built-in keyboard / gamepad controls (ReflexDefaultControls).
controls = ["bevy/keyboard", "bevy/gamepad"]
# Ground from Bevy meshes: entities with Mesh3d + ReflexCollider (ReflexMeshGroundPlugin).
mesh = ["bevy/bevy_mesh", "bevy/bevy_asset"]
# Debug drawing of the bike with gizmos (ReflexDebugDrawPlugin).
gizmos = ["bevy/bevy_gizmos", "bevy/bevy_color"]
# Everything the `ride` example needs (window, renderer, gamepads).
example = [
    "controls",
    "mesh",
    "gizmos",
    "bevy/bevy_winit",
    "bevy/bevy_window",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_pbr",
    "bevy/bevy_gizmos_render",
    "bevy/bevy_gilrs",
    "bevy/bevy_log",
    "bevy/tonemapping_luts",
    "bevy/zstd_rust",
    "bevy/multi_threaded",
]

[dependencies]
reflex_core = { path = "../reflex_core" }
bevy = { version = "0.20", default-features = false, features = ["std"] }

[[example]]
name = "ride"
required-features = ["example"]

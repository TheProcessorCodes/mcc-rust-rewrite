# The Skate 3 engine crates mcc_skate links, GPL-3.0 (see README.md here).
# Their own small workspace, as in the mashup they came from; built as path
# dependencies of the mcc-rust-rewrite workspace, which excludes this folder.
[workspace]
members = ["crates/skate-core", "crates/skate-data", "crates/skate-net"]
exclude = ["crates/skate-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }
